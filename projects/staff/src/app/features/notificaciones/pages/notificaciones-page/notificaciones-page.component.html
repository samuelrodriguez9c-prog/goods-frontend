<div class="pt-2 px-8 pb-8">
  <app-cabecera-modulo titulo="Notificaciones" [periodo]="null" [total]="total() + ' en total'">
    <tabler-icon icono [icon]="iconModulo" [size]="20" [stroke]="1.75" />
    <ng-container lectura>
      Todas tus notificaciones, con el detalle completo — la campanita solo muestra las últimas.
    </ng-container>
  </app-cabecera-modulo>

  <app-pantalla-estado [estado]="estadoPantalla()" modulo="Notificaciones" (reintentar)="cargar()" (volver)="volver()">
    <div esqueleto class="mt-[22px] flex animate-pulse flex-col gap-2.5">
      <span class="h-16 w-full rounded-xl bg-gray-100"></span>
      <span class="h-16 w-full rounded-xl bg-gray-100"></span>
      <span class="h-16 w-full rounded-xl bg-gray-100"></span>
    </div>

    <div class="mt-[22px] flex items-center justify-between">
      <button
        type="button"
        (click)="alternarSoloNoLeidas()"
        class="rounded-full px-2.5 py-1 text-xs font-medium transition-colors duration-150"
        [class]="soloNoLeidas() ? 'bg-[#303030] text-white' : 'bg-neutral-100 text-gray-600 hover:bg-gray-200'"
      >
        {{ soloNoLeidas() ? 'Mostrando: no leídas' : 'Mostrando: todas' }}
      </button>
      <span class="text-xs text-gray-400">Página {{ page() }} de {{ totalPaginas() }}</span>
    </div>

    <div class="mt-3 overflow-hidden rounded-xl border border-gray-200 bg-card-bg">
      @if (!notificaciones().length) {
        <p class="px-4 py-10 text-center text-sm text-gray-400">No hay notificaciones para mostrar.</p>
      }
      @for (n of notificaciones(); track n.id) {
        <button
          type="button"
          (click)="marcarLeida(n)"
          class="flex w-full items-start gap-3 border-b border-gray-100 px-4 py-3.5 text-left transition-colors duration-150 last:border-0 hover:bg-neutral-50"
        >
          <span
            class="flex size-8 shrink-0 items-center justify-center rounded-full"
            [class]="n.leidaEn ? 'bg-neutral-100 text-gray-400' : 'bg-sky-100 text-sky-700'"
          >
            <tabler-icon [icon]="catalogoTipo(n.tipo).icono" [size]="16" [stroke]="1.75" />
          </span>
          <span class="min-w-0 flex-1">
            <span class="flex flex-wrap items-center gap-x-2 gap-y-0.5">
              <span class="text-[13px] font-semibold text-gray-900" [class.text-gray-500]="n.leidaEn">
                {{ n.titulo }}
              </span>
              <span class="rounded-full bg-neutral-100 px-1.5 py-0.5 text-[10px] font-medium uppercase tracking-wide text-gray-500">
                {{ catalogoTipo(n.tipo).etiqueta }}
              </span>
              @if (!n.leidaEn) {
                <span class="h-1.5 w-1.5 shrink-0 rounded-full bg-blue-600"></span>
              }
            </span>
            <p class="mt-0.5 whitespace-pre-wrap text-xs text-gray-500">{{ n.cuerpo }}</p>
            <p class="mt-1 text-[11px] text-gray-400">{{ fechaCompleta(n.creadoEn) }}</p>
          </span>
          @if (n.leidaEn) {
            <tabler-icon [icon]="iconLeida" [size]="15" [stroke]="1.75" class="mt-1 shrink-0 text-emerald-500" />
          }
        </button>
      }
    </div>

    @if (totalPaginas() > 1) {
      <div class="mt-3 flex items-center justify-center gap-2">
        <button
          type="button"
          [disabled]="page() <= 1"
          (click)="paginaAnterior()"
          class="rounded-lg border border-gray-200 bg-card-bg px-3 py-1.5 text-xs font-medium text-gray-700 hover:bg-canvas-bg disabled:opacity-40"
        >
          Anterior
        </button>
        <button
          type="button"
          [disabled]="page() >= totalPaginas()"
          (click)="paginaSiguiente()"
          class="rounded-lg border border-gray-200 bg-card-bg px-3 py-1.5 text-xs font-medium text-gray-700 hover:bg-canvas-bg disabled:opacity-40"
        >
          Siguiente
        </button>
      </div>
    }
  </app-pantalla-estado>
</div>
