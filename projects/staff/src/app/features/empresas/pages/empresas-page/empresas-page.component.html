<app-cabecera-modulo
  titulo="Empresas"
  [metricas]="metricas()"
  [activa]="filtro()"
  [badge]="badge()"
  [periodoTitulo]="(hoy | date: 'EEEE d \'de\' MMMM') ?? ''"
  (metricaClick)="alternarMetrica($event)"
>
  <tabler-icon icono [icon]="iconEmpresas" [size]="20" [stroke]="1.75" />
  <ng-container acciones>
    <button type="button" (click)="exportar()" class="rounded-lg bg-[#e3e3e3] px-3 py-[7px] text-[13px] font-medium text-[#303030] hover:bg-[#d4d4d4]">Exportar</button>
    <button
      type="button"
      (click)="abrirNuevaEmpresa()"
      class="flex items-center gap-1.5 rounded-lg bg-[#303030] px-3 py-[7px] text-[13px] font-medium text-white shadow-[inset_0_-1px_0_#000] hover:opacity-90"
    >
      <tabler-icon [icon]="iconAgregar" [size]="14" [stroke]="1.75" />
      Nueva Empresa
    </button>
  </ng-container>
  <ng-container lectura>{{ lectura() }}</ng-container>
</app-cabecera-modulo>

<app-pantalla-estado class="mt-4 flex min-h-0 flex-1 flex-col" [estado]="estadoPantalla()" modulo="Empresas" (reintentar)="cargar()" (volver)="volver()">
  <div esqueleto class="grid flex-1 animate-pulse grid-cols-[minmax(250px,0.78fr)_minmax(0,1.42fr)] gap-4">
    <div class="flex flex-col gap-2">
      @for (s of [1, 2, 3, 4, 5, 6]; track s) {
        <span class="h-12 rounded-xl bg-[#e6e6e6]" [style.opacity]="1 - s * 0.12"></span>
      }
    </div>
    <div class="rounded-2xl bg-white"></div>
  </div>

  <app-lista-hoja
    etiquetaLista="Índice de Empresas"
    placeholder="Nombre, correo o dueño"
    vacioTexto="No hay Empresas que coincidan."
    [grupos]="grupos()"
    [seleccionadaId]="seleccionadaId()"
    [colapsados]="colapsados()"
    [resaltadas]="resaltadas()"
    [buscar]="buscar()"
    [resultados]="resultados()"
    [filtroTexto]="filtroTexto()"
    [cambios]="cambiosEnVivo()"
    [ordenIcono]="ordenIcono()"
    [ordenTitulo]="ordenTitulo()"
    (seleccionar)="seleccionadaId.set($event)"
    (buscarChange)="buscar.set($event)"
    (alternarOrden)="alternarOrden()"
    (alternarGrupo)="alternarGrupo($event)"
    (quitarFiltro)="filtro.set(null)"
    (limpiar)="limpiar()"
    (actualizar)="actualizar()"
  >
    <div hoja class="flex min-h-0 flex-1 flex-col">
      @if (seleccionada(); as e) {
        <app-empresa-ficha
          [empresa]="e"
          [planes]="planes()"
          [posicion]="lista()?.posicion() ?? ''"
          (anterior)="lista()?.mover(-1)"
          (siguiente)="lista()?.mover(1)"
          (actualizada)="onActualizada($event)"
          (recargar)="cargar()"
        />
      } @else {
        <p class="m-auto text-[13px] text-gray-500">Elegí una Empresa de la lista.</p>
      }
    </div>
  </app-lista-hoja>
</app-pantalla-estado>
