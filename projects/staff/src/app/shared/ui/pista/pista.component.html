<!-- projects/staff/src/app/shared/ui/pista/pista.component.html -->
<div
  role="status"
  aria-live="polite"
  (mouseenter)="pista.pausar()"
  (mouseleave)="pista.reanudar()"
  class="fixed bottom-6 left-1/2 z-[60] overflow-hidden rounded-xl bg-[#1a1a1a] text-white shadow-[0_12px_32px_-8px_rgba(0,0,0,0.35)] transition-[opacity,transform] duration-300 ease-[cubic-bezier(0.2,0.8,0.2,1)]"
  [class]="pista.visible() ? 'translate-x-[-50%] translate-y-0 scale-100 opacity-100' : 'pointer-events-none translate-x-[-50%] translate-y-4 scale-[0.97] opacity-0'"
>
  @if (p(); as p) {
    <div class="flex items-center gap-2.5 whitespace-nowrap py-2.5 pl-3.5 pr-3" [class]="par() ? 'anim-pista-a' : 'anim-pista-b'">
      @if (p.tipo === 'atajo') {
        <kbd class="min-w-5 rounded-[5px] border border-b-2 border-[#444] bg-[#262626] px-[5px] text-center font-sans text-[11px] font-semibold text-[#2be0d5]">{{ p.tecla }}</kbd>
      } @else if (icono(); as i) {
        <tabler-icon [icon]="i" [size]="15" [stroke]="2" class="text-[#2be0d5]" />
      }
      <span class="text-[13px]">{{ p.prefijo }}<strong class="font-semibold">{{ p.texto }}</strong></span>
      @if (p.accion) {
        <button
          type="button"
          (click)="pista.ejecutarAccion()"
          class="ml-1 border-0 border-l border-white/[0.18] bg-transparent pl-3 text-[12.5px] font-semibold text-[#2be0d5] transition-colors duration-150 hover:text-[#8ff0ea]"
        >
          {{ p.accion }}
        </button>
      }
    </div>
    @if (p.accion) {
      <span
        class="absolute inset-x-0 bottom-0 h-0.5 origin-left bg-[#2be0d5] opacity-90"
        [class]="par() ? 'anim-barra-a' : 'anim-barra-b'"
        [style.animation-duration.ms]="p.duracion"
        [style.animation-play-state]="pista.pausada() ? 'paused' : 'running'"
      ></span>
    }
  }
</div>
