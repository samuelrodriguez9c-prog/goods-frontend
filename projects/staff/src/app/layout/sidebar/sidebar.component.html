<nav
  class="relative flex h-full w-56 shrink-0 flex-col gap-0.5 rounded-tl-xl bg-sidebar-bg p-2.5"
  (mouseleave)="hoveredIndex.set(null)"
>
  <!-- Indicador deslizante — ver comentario del componente y
       ADMIN_DISENO.md > "Sidebar > Animación" (mismo mecanismo que
       `admin`, sin la parte de submenús que acá no aplica). `inset-x-2.5`
       calza con el `p-2.5` del `<nav>` (ajuste 2026-09-23: sidebar más
       compacto, pedido explícito — ver ADMIN_DISENO.md). -->
  <div
    class="pointer-events-none absolute inset-x-2.5 z-0 rounded-lg bg-nav-active transition-all duration-200 ease-out"
    [style.top.px]="indicatorTop()"
    [style.height.px]="indicatorHeight()"
    [style.opacity]="indicatorVisible() ? 1 : 0"
  ></div>

  @for (item of navItems(); track item.path; let i = $index) {
    <a
      #link
      [routerLink]="item.path"
      routerLinkActive
      #rla="routerLinkActive"
      [routerLinkActiveOptions]="{ exact: item.exact }"
      (isActiveChange)="onActiveChange(i, $event)"
      (mouseenter)="hoveredIndex.set(i)"
      [class.text-gray-900]="rla.isActive"
      class="relative z-10 flex items-center gap-2.5 rounded-lg px-2.5 py-[7px] text-[13px] font-medium text-gray-700 transition-colors duration-200 ease-out"
    >
      <tabler-icon [icon]="item.icon" [size]="18" [stroke]="1.75" svgClass="shrink-0" />
      <span class="truncate">{{ item.label }}</span>
    </a>
  }

  <!-- Settings: link simple, sin submenú propio, empujado al fondo —
       calcado de `admin/layout/sidebar/` (ver comentario de
       `settingsItem` en el componente). Sin sección "Administración"
       arriba de él (acá no aplica, ver comentario de la clase). -->
  <div class="mt-auto">
    <a
      [routerLink]="settingsItem.path"
      routerLinkActive="bg-nav-active text-gray-900"
      [routerLinkActiveOptions]="{ exact: settingsItem.exact }"
      class="flex items-center gap-2.5 rounded-lg px-2.5 py-[7px] text-[13px] font-medium text-gray-700 transition-colors duration-200 ease-out hover:bg-nav-active"
    >
      <tabler-icon [icon]="settingsItem.icon" [size]="18" [stroke]="1.75" svgClass="shrink-0" />
      <span class="truncate">{{ settingsItem.label }}</span>
    </a>
  </div>
</nav>
