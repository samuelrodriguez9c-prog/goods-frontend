<div class="shell-raiz flex h-screen flex-col supports-[height:100dvh]:h-dvh">
  <app-topbar />
  <div class="flex flex-1 overflow-hidden bg-topbar">
    <app-sidebar />
    <main class="escala-contenido sin-barra flex-1 overflow-y-auto rounded-tr-xl bg-canvas-bg">
      <!-- Acceso de la Empresa: franja en mora, o la pantalla de bloqueo en vez del contenido si no puede operar. -->
      @if (acceso(); as a) {
        <!-- Con la cuenta bloqueada siguen el chat con Goods, las notificaciones y Settings: el backend los permite. -->
        @if (a.estado === 'bloqueada' && !rutaLibre()) {
          <app-acceso-empresa [acceso]="a" variante="bloqueo" />
        } @else {
          @if (a.estado === 'en_mora') {
            <app-acceso-empresa [acceso]="a" variante="banner" />
          } @else if (a.estado === 'en_prueba') {
            <app-acceso-empresa [acceso]="a" variante="prueba" />
          } @else if (a.proximoCobro) {
            <app-acceso-empresa [acceso]="a" variante="cobro" />
          }
          <router-outlet />
        }
      } @else {
        <router-outlet />
      }
    </main>
  </div>
  <app-alerta-pila />
  <app-alerta-overlay />
  <app-pista />
  <app-asistente-dock />
</div>
