<div class="flex h-screen flex-col">
  <app-topbar />
  <div class="flex flex-1 overflow-hidden bg-topbar">
    <app-sidebar />
    <main class="escala-contenido flex-1 overflow-y-auto rounded-tr-xl bg-canvas-bg">
      <!-- Acceso de la Empresa (2026-10-04): banner en mora, o la pantalla
           de bloqueo en vez del contenido si no puede operar. -->
      @if (acceso(); as a) {
        <!-- Con la cuenta bloqueada siguen disponibles el chat con Goods
             (/messages), las notificaciones y Settings: el backend los
             permite (AccesoEmpresaInterceptor). -->
        @if (a.estado === 'bloqueada' && !rutaLibre()) {
          <app-acceso-empresa [acceso]="a" variante="bloqueo" />
        } @else {
          @if (a.estado === 'en_mora') {
            <app-acceso-empresa [acceso]="a" variante="banner" />
          } @else if (a.proximoCobro) {
            <app-acceso-empresa [acceso]="a" variante="cobro" />
          }
          <router-outlet />
        }
      } @else {
        <router-outlet />
      }
    </main>
  </div>
  <app-alerta-pila />
  <app-alerta-overlay />
  <app-pista />
  <app-asistente-dock />
</div>
