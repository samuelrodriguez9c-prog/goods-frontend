<header class="flex h-14 shrink-0 items-center gap-4 bg-topbar px-4 text-white">
  <!-- Izquierda: logo + badge de versión. Calcado de la esquina superior
       izquierda de Shopify (ícono + wordmark "shopify" + badge "Spring
       '26") — ver ADMIN_DISENO.md > "Topbar". Sin ícono propio todavía,
       solo wordmark de texto (placeholder hasta tener un logo real). -->
  <div class="flex items-center gap-3">
    <span class="text-xl font-bold italic tracking-tight">Goods</span>
    <span
      class="rounded-full border border-topbar-badge-border px-3 py-1 text-xs italic leading-none text-topbar-badge-text"
    >
      v0.1
    </span>
  </div>

  <!-- Centro: buscador global. Calcado de la barra de búsqueda de
       Shopify (ícono + placeholder "Search" + hint de atajo ⌘K) — ver
       ADMIN_DISENO.md > "Topbar". Es un <input> real (enfocable,
       escribible) pero sin lógica de búsqueda ni atajo de teclado
       conectados todavía — eso es trabajo aparte. -->
  <div class="flex flex-1 justify-center">
    <label
      class="flex h-9 w-full max-w-xl items-center gap-2 rounded-lg bg-topbar-search-bg px-3 text-neutral-400 focus-within:ring-1 focus-within:ring-neutral-500"
    >
      <tabler-icon [icon]="iconSearch" [size]="16" [stroke]="2" svgClass="shrink-0" />
      <input
        type="text"
        placeholder="Search"
        class="min-w-0 flex-1 bg-transparent text-sm text-white placeholder-neutral-400 outline-none"
      />
      <span class="flex shrink-0 items-center gap-1">
        <kbd
          class="flex h-5 w-5 items-center justify-center rounded bg-topbar-kbd-bg text-xs text-neutral-400"
          >⌘</kbd
        >
        <kbd
          class="flex h-5 w-5 items-center justify-center rounded bg-topbar-kbd-bg text-xs text-neutral-400"
          >K</kbd
        >
      </span>
    </label>
  </div>

  <!-- Derecha: asistente IA, notificaciones, avatar + usuario. Calcado
       de la esquina superior derecha de Shopify — ver ADMIN_DISENO.md >
       "Topbar". Los tres son solo estructura/estilo por ahora: sin
       panel de asistente, sin lista de notificaciones, y sin datos
       reales de usuario (todavía no hay `core/auth`). -->
  <div class="flex shrink-0 items-center gap-1">
    <button
      type="button"
      aria-label="Asistente IA"
      class="rounded-md p-1.5 text-neutral-300 hover:bg-white/10 hover:text-white"
    >
      <tabler-icon [icon]="iconBot" [size]="20" [stroke]="1.75" />
    </button>
    <button
      type="button"
      aria-label="Notificaciones"
      class="rounded-md p-1.5 text-neutral-300 hover:bg-white/10 hover:text-white"
    >
      <tabler-icon [icon]="iconBell" [size]="20" [stroke]="1.75" />
    </button>
    <button
      type="button"
      class="ml-2 flex items-center gap-2 rounded-md p-1 hover:bg-white/10"
    >
      <span
        class="flex h-7 w-7 items-center justify-center rounded-md bg-topbar-avatar-bg text-xs font-semibold text-topbar-avatar-text"
      >
        AD
      </span>
      <span class="text-sm font-medium">Admin</span>
    </button>
  </div>
</header>
