<section class="tienda-ficha flex flex-col gap-3.5 rounded-2xl border border-[#ebebeb] bg-white p-[18px] shadow-[0_1px_2px_rgba(0,0,0,.03),0_12px_28px_-22px_rgba(0,0,0,.28)] [animation-delay:.08s]">
  @let h = hero();
  <div class="flex items-center gap-3">
    <span class="relative grid size-[42px] shrink-0 place-items-center rounded-xl transition-colors duration-[350ms]" [style.background]="h.bg" [style.color]="h.fg">
      @if (s.activa()) { <span class="tienda-respira absolute right-[-2px] top-[-2px] size-2.5 rounded-full bg-[#22c55e] shadow-[0_0_0_2px_#fff]"></span> }
      <tabler-icon [icon]="h.icono" [size]="21" [stroke]="1.75" />
    </span>
    <span class="flex min-w-0 flex-1 flex-col gap-0.5">
      <span class="text-[15px] font-semibold tracking-[-0.005em] text-[#111827]">{{ h.titulo }}</span>
      <span class="text-pretty text-xs leading-[17px] text-[#8a8a8a]">{{ h.texto }}</span>
    </span>
  </div>
  <div class="relative grid grid-cols-2 rounded-[10px] bg-[#f1f1f1] p-[3px]">
    <span class="absolute inset-y-[3px] left-[3px] w-[calc((100%-6px)/2)] rounded-lg bg-white shadow-[0_1px_2px_rgba(0,0,0,.08),0_0_0_1px_rgba(0,0,0,.04)] transition-transform duration-[400ms] ease-[cubic-bezier(.3,1.3,.5,1)]" [style.transform]="s.activa() ? 'translateX(0)' : 'translateX(100%)'"></span>
    <button type="button" (click)="s.publicar()" [disabled]="s.guardando()" [title]="!s.activa() && !s.publicable() ? 'Completa lo pendiente para publicar' : 'Publicar tienda'"
      class="relative flex h-8 items-center justify-center gap-1.5 bg-transparent text-[12.5px] font-medium transition-colors" [style.color]="s.activa() ? '#111827' : '#6b7280'" [style.opacity]="!s.activa() && !s.publicable() ? 0.45 : 1">
      <span class="size-[7px] rounded-full bg-[#2fa65a]"></span>Publicada
    </button>
    <button type="button" (click)="s.pausar()" [disabled]="s.guardando()" class="relative flex h-8 items-center justify-center gap-1.5 bg-transparent text-[12.5px] font-medium transition-colors" [style.color]="!s.activa() ? '#111827' : '#6b7280'">
      <span class="size-[7px] rounded-full bg-[#a3a3a3]"></span>{{ s.teniaNumero() ? 'Pausada' : 'Sin publicar' }}
    </button>
  </div>
  <div class="flex flex-col rounded-xl px-1.5 py-1 shadow-[0_0_0_1px_#ececec]">
    @for (r of requisitos(); track r.label) {
      <button type="button" (click)="s.irA(r.sec)" class="flex items-center gap-2.5 rounded-lg bg-transparent px-1.5 py-[7px] text-left transition-colors hover:bg-[#f7f7f7]">
        <span class="grid size-5 shrink-0 place-items-center rounded-full text-white transition-colors duration-300" [style.background]="r.ok ? '#303030' : '#fff'" [style.box-shadow]="r.ok ? 'none' : 'inset 0 0 0 1.5px #d4d4d4'">
          @if (r.ok) { <tabler-icon [icon]="i.check" [size]="12" [stroke]="2.5" class="tienda-pop" /> }
        </span>
        <span class="flex-1 text-[12.5px] font-medium" [style.color]="r.ok ? '#303030' : '#6b7280'">{{ r.label }}</span>
        <span class="text-[11.5px]" [style.color]="r.ok ? '#9ca3af' : '#8a6100'">{{ r.nota }}</span>
      </button>
    }
  </div>
  <div class="flex flex-col gap-2">
    <app-tienda-etiqueta t="Compartir" sub="Mira abajo cómo se ve antes de mandarlo." />
    <div class="flex items-center overflow-hidden rounded-[10px] bg-[#fafafa] shadow-[0_0_0_1px_#e5e5e5] transition-opacity duration-300" [style.opacity]="s.activa() ? 1 : 0.5">
      <tabler-icon [icon]="i.mundo" [size]="15" [stroke]="2" class="ml-3 text-[#8a8a8a]" />
      <span class="min-w-0 flex-1 truncate px-2 py-[9px] text-[12.5px] text-[#303030]">{{ s.prefijo() }}<b class="font-semibold">{{ s.tienda()?.slug }}</b></span>
      <button type="button" (click)="s.copiar()" title="Copiar enlace" aria-label="Copiar enlace" class="mr-[3px] flex size-[30px] items-center justify-center rounded-lg bg-transparent text-[#4b5563] hover:bg-[#ececec] hover:text-[#111827]"><tabler-icon [icon]="i.copiar" [size]="15" [stroke]="2" /></button>
    </div>
    <div class="grid grid-cols-2 gap-2">
      <button type="button" (click)="s.tab.set('chat')" class="flex items-center justify-center gap-1.5 rounded-full bg-white px-3 py-[7px] text-[12.5px] font-medium text-[#303030] shadow-[0_0_0_1px_#e5e5e5] transition-[box-shadow,transform] hover:shadow-[0_0_0_1px_#b5b5b5] active:scale-[.97]"><tabler-icon [icon]="i.wa" [size]="15" [stroke]="2" class="text-[#1d8a4b]" />Por chat</button>
      <button type="button" (click)="s.tab.set('estado')" class="flex items-center justify-center gap-1.5 rounded-full bg-white px-3 py-[7px] text-[12.5px] font-medium text-[#303030] shadow-[0_0_0_1px_#e5e5e5] transition-[box-shadow,transform] hover:shadow-[0_0_0_1px_#b5b5b5] active:scale-[.97]"><tabler-icon [icon]="i.estado" [size]="15" [stroke]="2" />En tu estado</button>
    </div>
  </div>
</section>
