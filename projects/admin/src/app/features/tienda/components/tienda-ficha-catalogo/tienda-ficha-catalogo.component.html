@let fx = s.f();
<section #sec (mouseenter)="s.hov.set('catalogo')" (mouseleave)="s.hov.set(null)"
  class="tienda-ficha flex flex-col gap-[18px] rounded-2xl border bg-white p-5 transition-[border-color,box-shadow] duration-[250ms] [animation-delay:.15s]" [style.border-color]="s.borde('catalogo')" [style.box-shadow]="s.sombra('catalogo')">
  <app-tienda-cabeza [icono]="i.grid" titulo="Catálogo" sub="Sale solo de tus productos activos. Los cambios de precio o foto se hacen en Productos.">
    <button type="button" (click)="s.irProductos()" class="flex shrink-0 items-center gap-1.5 whitespace-nowrap rounded-full bg-white px-3 py-1.5 text-[12.5px] font-medium text-[#303030] shadow-[0_0_0_1px_#e5e5e5] hover:shadow-[0_0_0_1px_#b5b5b5]"><tabler-icon [icon]="i.paquete" [size]="14" [stroke]="2" />Ir a Productos</button>
  </app-tienda-cabeza>

  <div class="grid grid-cols-[repeat(auto-fit,minmax(max(240px,calc((100%-16px)/2)),1fr))] gap-4">
    <div class="flex flex-col gap-2">
      <app-tienda-etiqueta t="Moneda de los precios" sub="Cambiarla no convierte tus precios, solo el formato." />
      <div class="relative grid grid-cols-2 rounded-[10px] bg-[#f1f1f1] p-[3px]">
        <span class="absolute inset-y-[3px] left-[3px] w-[calc((100%-6px)/2)] rounded-lg bg-white shadow-[0_1px_2px_rgba(0,0,0,.08),0_0_0_1px_rgba(0,0,0,.04)] transition-transform duration-[350ms] ease-[cubic-bezier(.3,1.3,.5,1)]" [style.transform]="fx.moneda === 'USD' ? 'translateX(100%)' : 'translateX(0)'"></span>
        <button type="button" (click)="s.set('moneda', 'COP')" class="relative h-[30px] bg-transparent text-[12.5px] font-medium" [style.color]="fx.moneda === 'COP' ? '#111827' : '#6b7280'">Pesos (COP)</button>
        <button type="button" (click)="s.set('moneda', 'USD')" class="relative h-[30px] bg-transparent text-[12.5px] font-medium" [style.color]="fx.moneda === 'USD' ? '#111827' : '#6b7280'">Dólares (USD)</button>
      </div>
    </div>
    <div class="flex flex-col gap-2">
      <app-tienda-etiqueta t="Productos agotados" [sub]="fx.agotados ? 'Se ven con «Agotado» y no se pueden pedir.' : 'Vuelven a aparecer solos cuando haya stock.'" />
      <button type="button" role="switch" [attr.aria-checked]="fx.agotados" (click)="s.set('agotados', !fx.agotados)" class="flex h-9 items-center gap-2.5 rounded-[10px] bg-[#fafafa] pl-3 pr-2.5 text-left shadow-[0_0_0_1px_#e5e5e5] hover:shadow-[0_0_0_1px_#b5b5b5]">
        <span class="flex-1 text-[13px] text-[#303030]">{{ fx.agotados ? 'Se muestran con su etiqueta' : 'Se esconden de la tienda' }}</span>
        <span class="relative h-5 w-[34px] shrink-0 rounded-full transition-colors duration-[250ms]" [style.background]="fx.agotados ? '#303030' : '#d4d4d4'">
          <span class="absolute left-0.5 top-0.5 size-4 rounded-full bg-white shadow-[0_1px_2px_rgba(0,0,0,.25)] transition-transform duration-300 ease-[cubic-bezier(.3,1.5,.5,1)]" [style.transform]="fx.agotados ? 'translateX(14px)' : 'translateX(0)'"></span>
        </span>
      </button>
    </div>
  </div>

  <div class="flex flex-col gap-2.5">
    <div class="relative flex items-center gap-1.5">
      <label class="flex min-w-0 flex-1 items-center gap-2 rounded-full px-3 transition-[background-color,box-shadow]"
        [style.background]="fl.qFoco() ? '#fff' : '#f4f4f4'" [style.box-shadow]="fl.qFoco() ? '0 0 0 1px #303030,0 0 0 4px rgba(48,48,48,.08)' : 'none'">
        <tabler-icon [icon]="i.buscar" [size]="15" [stroke]="2" class="text-[#8a8a8a]" />
        <input [ngModel]="fl.q()" (ngModelChange)="fl.q.set($event)" (focus)="fl.qFoco.set(true)" (blur)="fl.qFoco.set(false)" placeholder="Nombre o categoría" class="min-w-0 flex-1 border-0 bg-transparent py-2 text-[13px] text-[#111827] outline-none" />
        @if (fl.q()) { <button type="button" (click)="fl.q.set('')" aria-label="Borrar búsqueda" class="flex bg-transparent p-0 text-[#8a8a8a]"><tabler-icon [icon]="i.cerrar" [size]="13" [stroke]="2" /></button> }
      </label>
      <button type="button" (click)="$event.stopPropagation(); fl.fOpen.set(!fl.fOpen())" title="Filtros y agrupación" aria-label="Filtros y agrupación" [attr.aria-expanded]="fl.fOpen()" class="relative flex size-[34px] shrink-0 items-center justify-center rounded-full text-[#4b5563] transition-colors hover:bg-[#e6e6e6]" [style.background]="fl.fOpen() ? '#e6e6e6' : 'transparent'">
        <tabler-icon [icon]="i.filtros" [size]="16" [stroke]="2" />
        @if (fl.filtrosActivos()) { <span class="absolute right-1 top-1 size-[7px] rounded-full bg-[#2be0d5] shadow-[0_0_0_2px_#fff]"></span> }
      </button>

      <app-tienda-filtros />
    </div>

    <div class="flex min-h-[22px] flex-wrap items-center gap-2 px-1.5">
      <span class="text-xs tabular-nums text-[#6b7280]">{{ fl.conteoTxt() }}</span>
      @for (c of fl.chips(); track c.label) {
        <span class="tienda-sube inline-flex items-center gap-1.5 rounded-full bg-[#e3e3e3] py-0.5 pl-2.5 pr-1 text-[11.5px] font-medium text-[#374151]">{{ c.label }}<button type="button" (click)="c.quitar()" [attr.aria-label]="'Quitar filtro ' + c.label" class="flex size-4 items-center justify-center rounded-full bg-transparent text-[#6b7280] hover:bg-[#d1d5db] hover:text-[#111827]"><tabler-icon [icon]="i.cerrar" [size]="11" [stroke]="2" /></button></span>
      }
    </div>

    @if (!fl.filtradas().length) {
      <div class="tienda-sube px-4 py-8 text-center">
        <p class="m-0 text-[13px] text-[#6b7280]">Ningún producto coincide con estos filtros.</p>
        <button type="button" (click)="fl.limpiarFiltros()" class="mt-3 rounded-full bg-[#e3e3e3] px-3 py-1.5 text-[13px] font-medium text-[#374151] hover:bg-[#d4d4d4]">Limpiar filtros</button>
      </div>
    }

    <app-tienda-catalogo-lista />
  </div>
</section>
