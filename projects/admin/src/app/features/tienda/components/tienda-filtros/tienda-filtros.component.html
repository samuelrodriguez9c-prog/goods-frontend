<div (click)="$event.stopPropagation()" class="absolute right-0 top-[42px] z-40 grid w-[min(380px,100%)] origin-top-right grid-cols-[132px_minmax(0,1fr)] overflow-hidden rounded-2xl bg-white shadow-[0_0_0_1px_rgba(0,0,0,.06),0_24px_48px_-20px_rgba(0,0,0,.35)] transition-[opacity,transform] duration-[260ms] ease-[cubic-bezier(.2,.8,.2,1)]"
  [style.opacity]="fl.fOpen() ? 1 : 0" [style.transform]="fl.fOpen() ? 'none' : 'translateY(-6px) scale(.98)'" [style.pointer-events]="fl.fOpen() ? 'auto' : 'none'">
  <div class="flex flex-col border-r border-[#efefef] bg-[#f7f7f7] px-1.5 pb-1.5 pt-2">
    <div class="px-1.5 pb-2 pt-1 font-display text-[13.5px] font-semibold text-[#111827]">Filtros</div>
    <div class="relative">
      <span class="absolute inset-x-0 top-0 h-[34px] rounded-[9px] bg-white shadow-[0_1px_2px_rgba(0,0,0,.06),0_0_0_1px_rgba(0,0,0,.04)] transition-transform duration-[320ms] ease-[cubic-bezier(.2,.8,.2,1)]"
        [style.transform]="'translateY(' + (['estado', 'categoria', 'foto', 'agrupar'].indexOf(fl.fSec()) * 36) + 'px)'"></span>
      @for (x of fl.secciones(); track x.k) {
        <button type="button" (click)="fl.fSec.set(x.k)" class="relative z-[1] mb-0.5 flex h-[34px] w-full items-center gap-[7px] bg-transparent px-2 text-left" [style.color]="fl.fSec() === x.k ? '#111827' : '#6b7280'">
          <tabler-icon [icon]="x.icono" [size]="15" [stroke]="2" />
          <span class="min-w-0 flex-1 truncate text-[12.5px] font-semibold">{{ x.t }}</span>
          @if (x.act) { <span class="tienda-pop size-[7px] shrink-0 rounded-full bg-[#2be0d5] shadow-[0_0_0_3px_rgba(43,224,213,.2)]"></span> }
        </button>
      }
    </div>
    <button type="button" (click)="fl.limpiarFiltros()" class="mt-auto self-start bg-transparent px-2 pb-0.5 pt-2 text-xs font-medium text-[#6b7280] hover:text-[#111827]">Limpiar todo</button>
  </div>
  <div class="flex max-h-[270px] min-h-[200px] flex-col">
    <div class="min-h-0 flex-1 overflow-y-auto px-2 pb-1 pt-2.5">
      <div class="tienda-ficha flex flex-col gap-1.5">
        <div class="px-1.5 pt-0.5 text-[11.5px] leading-4 text-[#8a8a8a]">{{ fl.panel().d }}</div>
        <div class="flex flex-col gap-px">
          @for (o of fl.panel().rows; track o.t) {
            <button type="button" (click)="o.pick()" class="grid grid-cols-[18px_minmax(0,1fr)_auto] items-center gap-[9px] rounded-lg px-2 py-1.5 text-left transition-colors hover:bg-[#f7f7f7]" [style.background]="o.on ? '#f7f7f7' : 'transparent'">
              @if (fl.panel().multi) {
                <span class="flex size-[18px] items-center justify-center rounded-md text-white transition-[background-color,box-shadow]" [style.background]="o.on ? '#303030' : '#fff'" [style.box-shadow]="'inset 0 0 0 1.5px ' + (o.on ? '#303030' : '#d4d4d4')">
                  <tabler-icon [icon]="i.check" [size]="12" [stroke]="2.5" class="transition-transform duration-[250ms] ease-[cubic-bezier(.34,1.56,.64,1)]" [style.transform]="'scale(' + (o.on ? 1 : 0) + ')'" />
                </span>
              } @else {
                <span class="flex size-[18px] items-center justify-center rounded-full transition-shadow" [style.box-shadow]="'inset 0 0 0 1.5px ' + (o.on ? '#303030' : '#d4d4d4')">
                  <span class="size-2 rounded-full bg-[#303030] transition-transform duration-[250ms] ease-[cubic-bezier(.34,1.56,.64,1)]" [style.transform]="'scale(' + (o.on ? 1 : 0) + ')'"></span>
                </span>
              }
              <span class="flex min-w-0 items-center gap-[7px] truncate text-[12.5px] font-medium text-[#111827]">@if (o.dot) { <span class="size-[7px] shrink-0 rounded-full" [style.background]="o.dot"></span> }{{ o.t }}</span>
              <span class="text-xs font-semibold tabular-nums text-[#6b7280]">{{ o.n }}</span>
            </button>
          }
        </div>
      </div>
    </div>
    <div class="flex items-center justify-between gap-2 border-t border-[#f1f1f1] px-2.5 py-2">
      <span class="text-xs font-semibold text-[#111827]">{{ fl.filtradas().length === 1 ? '1 producto' : fl.filtradas().length + ' productos' }}</span>
      <button type="button" (click)="fl.fOpen.set(false)" class="rounded-lg bg-[#303030] px-[11px] py-1.5 text-[12.5px] font-medium text-white shadow-[inset_0_-1px_0_#000]">Ver resultados</button>
    </div>
  </div>
</div>
