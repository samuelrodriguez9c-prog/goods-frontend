<button type="button" (click)="alternar($event)" (wheel)="rueda($event)" aria-haspopup="listbox" [attr.aria-expanded]="abierto()"
  title="Cambiar de sección · rueda del mouse o G + letra"
  class="-mx-1.5 -my-px flex h-7.5 cursor-pointer items-center gap-[3px] rounded-[7px] border-0 bg-transparent py-0 pr-[3px] pl-1.5 [font:inherit] [letter-spacing:inherit] text-[inherit] transition-[background] duration-200 hover:bg-[#e6e6e6]">
  <span class="relative block h-7 overflow-hidden transition-[width] duration-[450ms] ease-[cubic-bezier(.3,1.2,.5,1)]" [style.width]="ancho()">
    <span class="flex flex-col transition-transform duration-500 ease-[cubic-bezier(.3,1.3,.5,1)]" [style.transform]="'translateY(' + -idx() * 28 + 'px)'">
      @for (s of secciones; track s.k; let n = $index) {
        <span #palabra class="block h-7 w-max leading-7 whitespace-nowrap" [class]="n === idx() ? 'text-[#111827]' : 'text-[#9ca3af]'">{{ s.label }}</span>
      }
    </span>
  </span>
  <tabler-icon [icon]="i.chevron" [size]="13" [stroke]="2" class="text-[#9ca3af] transition-transform duration-[250ms]" [class.rotate-180]="abierto()" />
</button>

@if (abierto()) {
  <div role="listbox" (click)="$event.stopPropagation()"
    class="absolute top-[calc(100%+8px)] -left-1.5 z-40 w-58 origin-[24px_-8px] animate-[wa-drum_.24s_cubic-bezier(.2,.9,.3,1.15)] rounded-xl bg-white p-1 font-[Inter,sans-serif] tracking-normal shadow-[0_0_0_1px_rgba(0,0,0,.06),0_18px_40px_-14px_rgba(0,0,0,.35)]">
    <div class="flex flex-col gap-[3px]">
      @for (s of secciones; track s.k; let n = $index) {
        @let on = n === idx();
        @let e = estados()[s.k];
        <button type="button" role="option" [attr.aria-selected]="on" (click)="elegir(s.k)" [title]="'G + ' + s.tecla"
          [style.animation-delay.ms]="n * 35"
          class="flex h-8 w-full animate-[wa-entra_.25s_ease-out_both] cursor-pointer items-center gap-2 rounded-[7px] border-0 px-2 text-left transition-[background] duration-150"
          [class]="on ? 'bg-[#efefef]' : 'bg-transparent hover:bg-[#f7f7f7]'">
          <tabler-icon [icon]="s.icono" [size]="15" [stroke]="2" [class]="on ? 'text-[#111827]' : 'text-[#9ca3af]'" />
          <span class="flex-1 text-[12.5px]" [class]="on ? 'font-semibold text-[#111827]' : 'font-medium text-[#374151]'">{{ s.label }}</span>
          @if (e.vivo) {
            <span class="size-[5px] animate-[wa-latido_2s_ease-in-out_infinite] rounded-full bg-[#2be0d5]"></span>
          }
          <span class="text-[11.5px] font-semibold tabular-nums" [style.color]="e.numColor">{{ e.num }}</span>
          <span class="w-16.5 truncate text-[11px] text-[#9ca3af]">{{ e.numK }}</span>
        </button>
      }
    </div>
    <p class="mx-0 mt-1 mb-0 flex items-center gap-[5px] border-t border-t-[#f1f1f1] px-2 pt-[7px] pb-1 text-[10.5px] text-[#9ca3af]">
      <tabler-icon [icon]="i.mouse" [size]="12" [stroke]="2" />Rueda sobre el título<span class="flex-1"></span>
      <kbd class="flex h-[15px] items-center rounded bg-[#f5f5f5] px-1 font-[inherit] text-[9.5px] font-semibold text-[#6b7280] shadow-[inset_0_0_0_1px_#e3e3e3]">G</kbd>+ letra
    </p>
  </div>
}
