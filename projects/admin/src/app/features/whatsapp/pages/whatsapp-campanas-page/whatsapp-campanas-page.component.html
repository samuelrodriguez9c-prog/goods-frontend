@if (cargando()) {
  <div class="flex animate-pulse flex-wrap items-start gap-4">
    <div class="h-[460px] min-w-0 flex-[1_1_440px] rounded-[14px] bg-white/70"></div>
  </div>
} @else if (error(); as e) {
  <p role="alert" class="m-0 rounded-[14px] bg-white p-6 text-center text-[13px] text-[#b42318]">{{ e }}</p>
} @else {
  <div class="flex flex-wrap items-start gap-4 text-[13px] leading-[normal]">
    <div class="flex min-w-0 flex-[1_1_440px] flex-col gap-3">
      @if (audiencia(); as a) {
        <app-alcance-hoy [audiencia]="a" />
      }
      <app-historial-campanas
        [campanas]="campanas()"
        [alcance]="alcance()"
        [puedeConfigurar]="puedeConfigurar()"
        [editandoId]="form()?.campana?.id ?? null"
        [cancelandoId]="cancelandoId()"
        (editar)="editar($event)"
        (cancelar)="cancelar($event)" />
    </div>

    @for (k of form() ? [form()!.n] : []; track k) {
      <section class="sticky top-0 max-w-[440px] flex-[1_1_360px] animate-[wa-entra_.3s_cubic-bezier(.2,.8,.2,1)] overflow-hidden rounded-[14px] bg-white shadow-[0_0_0_1px_rgba(0,0,0,.04),0_1px_2px_rgba(0,0,0,.04)]">
        <app-formulario-campana
          [promos]="promos()"
          [alcance]="alcance()"
          [campana]="form()!.campana"
          [plantillaInicial]="form()!.plantilla"
          (guardada)="guardada($event)"
          (cerrar)="form.set(null)" />
      </section>
    }
  </div>
}
