<div class="mt-4 border-t border-[#f3f4f6] pt-3.5">
  <button type="button" (click)="abierto.set(!abierto())" [attr.aria-expanded]="abierto()"
    class="flex cursor-pointer items-center gap-1.5 border-0 bg-transparent p-0 text-[13px] font-medium text-[#6b7280] transition-colors duration-200 hover:text-[#111827]">
    <tabler-icon [icon]="iChevron" [size]="14" [stroke]="2" class="flex transition-transform duration-200" [class]="abierto() ? 'rotate-90' : 'rotate-0'" />Conectar a mano con el número de prueba de Meta
  </button>
  <div class="grid transition-[grid-template-rows] duration-250 ease-out" [class]="abierto() ? 'grid-rows-[1fr]' : 'grid-rows-[0fr]'">
    <div class="min-h-0 overflow-hidden">
      <form (submit)="$event.preventDefault(); enviar()" class="grid gap-2.5 pt-3" [attr.inert]="abierto() ? null : ''">
        <p class="m-0 text-[12px] text-[#6b7280]">En developers.facebook.com → tu app → WhatsApp → Configuración de la API.</p>
        <label class="grid gap-1 text-[12.5px] font-medium text-[#374151]">
          Token de acceso
          <input type="password" name="token" autocomplete="off" [value]="token()" (input)="token.set($any($event.target).value)"
            class="wa-input font-normal" />
        </label>
        <div class="grid grid-cols-[repeat(auto-fit,minmax(180px,1fr))] gap-2.5">
          <label class="grid gap-1 text-[12.5px] font-medium text-[#374151]">
            Identificador del número
            <input name="phoneNumberId" inputmode="numeric" autocomplete="off" [value]="phoneNumberId()" (input)="phoneNumberId.set($any($event.target).value)"
              class="wa-input font-normal" />
          </label>
          <label class="grid gap-1 text-[12.5px] font-medium text-[#374151]">
            Identificador de la cuenta (opcional)
            <input name="wabaId" inputmode="numeric" autocomplete="off" [value]="wabaId()" (input)="wabaId.set($any($event.target).value)"
              class="wa-input font-normal" />
          </label>
        </div>
        <button type="submit" [disabled]="conectando() || !valido()"
          class="flex items-center gap-2 justify-self-start rounded-lg border-0 bg-[#f1f1f1] px-3 py-[7px] text-[13px] font-medium text-[#303030] transition-colors duration-200 hover:bg-[#e6e6e6] disabled:cursor-default disabled:opacity-50 disabled:hover:bg-[#f1f1f1]">
          @if (conectando()) {
            <span class="size-3.5 animate-spin rounded-full border-2 border-[#d4d4d4] border-t-[#303030]"></span>Conectando…
          } @else {
            Conectar con estos datos
          }
        </button>
      </form>
    </div>
  </div>
</div>
