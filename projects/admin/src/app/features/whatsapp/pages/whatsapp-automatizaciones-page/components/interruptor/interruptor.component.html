<button type="button" role="switch" [attr.aria-checked]="activo()" [attr.aria-label]="etiqueta()" [attr.aria-disabled]="desactivado() || null"
  (click)="tocar($event)"
  class="relative h-[19px] w-8 shrink-0 rounded-full border-0 p-0 transition-[background] duration-200 outline-none focus-visible:ring-2 focus-visible:ring-[#2be0d5] focus-visible:ring-offset-2"
  [class]="(activo() ? 'bg-[#303030] ' : 'bg-[#d4d4d4] ') + (desactivado() ? 'cursor-default' : ocupado() ? 'cursor-progress' : 'cursor-pointer')">
  <span class="absolute top-0.5 size-[15px] rounded-full bg-white shadow-[0_1px_2px_rgba(0,0,0,.2)] transition-[left] duration-200 ease-[cubic-bezier(.3,1.3,.5,1)]"
    [class]="activo() ? 'left-[15px]' : 'left-0.5'"></span>
</button>
