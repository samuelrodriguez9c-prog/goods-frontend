<section class="rounded-2xl bg-[#0a0a0a] p-4 text-white">
  <p class="m-0 flex items-center gap-[7px] text-[13px] font-semibold">
    <tabler-icon [icon]="i.prueba" [size]="16" [stroke]="2" class="flex text-[#2be0d5]" />Pruébalo
  </p>
  <p class="mt-[3px] mb-3 text-[12px] text-[#a3a3a3]">Escribe como si fueras un cliente y mira quién responde.</p>
  <div class="mb-2.5 flex flex-wrap gap-1.5">
    <button type="button" (click)="nuevo.set(!nuevo())" [attr.aria-pressed]="nuevo()"
      class="flex cursor-pointer items-center gap-1.5 rounded-[7px] border-0 bg-[rgba(255,255,255,.1)] px-[9px] py-[5px] text-[12px] font-medium text-white transition-[background] duration-200 hover:bg-[rgba(255,255,255,.15)]">
      <tabler-icon [icon]="i.cliente" [size]="13" [stroke]="2" class="flex" />{{ nuevo() ? 'Cliente nuevo' : 'Cliente conocido' }}
    </button>
    <button type="button" (click)="abierto.set(!abierto())" [attr.aria-pressed]="abierto()"
      class="flex cursor-pointer items-center gap-1.5 rounded-[7px] border-0 bg-[rgba(255,255,255,.1)] px-[9px] py-[5px] text-[12px] font-medium text-white transition-[background] duration-200 hover:bg-[rgba(255,255,255,.15)]">
      <tabler-icon [icon]="abierto() ? i.sol : i.luna" [size]="13" [stroke]="2" class="flex" />{{ abierto() ? 'Tienda abierta' : 'Tienda cerrada' }}
    </button>
  </div>
  <label class="flex h-[38px] items-center gap-2 rounded-[9px] bg-[#262626] pr-1.5 pl-3">
    <input [value]="texto()" (input)="texto.set($any($event.target).value)" placeholder="Hola, ¿tienen catálogo?" aria-label="Mensaje de prueba"
      class="min-w-0 flex-1 border-0 bg-transparent text-[13px] text-white outline-none placeholder:text-[#757575]" />
  </label>
  <div class="mt-2 flex flex-wrap gap-[5px]">
    @for (t of ejemplos; track t) {
      <button type="button" (click)="texto.set(t)"
        class="cursor-pointer rounded-full border-0 bg-[rgba(255,255,255,.08)] px-[9px] py-1 text-[11.5px] text-[#d4d4d4] transition-[background] duration-200 hover:bg-[rgba(255,255,255,.15)]">{{ t }}</button>
    }
  </div>
  @if (respuesta(); as r) {
    <div class="mt-3 animate-[wa-entra_.25s_ease-out] rounded-[11px] bg-[#efe7de] p-3">
      <div class="flex justify-end">
        <span class="max-w-[85%] rounded-[9px] bg-[#d9fdd3] px-[9px] py-1.5 text-[12.5px] text-[#111827]">{{ texto() }}</span>
      </div>
      <div class="mt-1.5 flex">
        <span class="max-w-[85%] rounded-[9px] bg-white px-[9px] py-1.5 text-[12.5px] leading-[1.4] text-[#111827] shadow-[0_1px_.5px_rgba(0,0,0,.1)]">
          <span class="mb-0.5 flex items-center gap-1 text-[10.5px] font-semibold text-[#00857e]">
            @if (r.paso === 'ia') {
              <app-ia-marca [size]="13" [fondo]="true" />
            } @else {
              <tabler-icon [icon]="icono()" [size]="11" [stroke]="2" class="flex" />
            }{{ r.quien }}
          </span><span class="whitespace-pre-wrap">{{ r.texto }}</span>
        </span>
      </div>
    </div>
  }
</section>
