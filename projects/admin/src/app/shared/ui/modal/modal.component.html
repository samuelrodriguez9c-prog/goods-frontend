<div
  class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4"
  (click)="onBackdropClick($event)"
>
  <div
    class="w-full max-w-lg max-h-[90vh] overflow-y-auto rounded-2xl bg-card-bg p-6 shadow-xl"
  >
    <div class="mb-4 flex items-center justify-between">
      <h2 class="text-lg font-semibold text-gray-900">{{ titulo }}</h2>
      <button
        type="button"
        (click)="cerrar.emit()"
        class="rounded-lg p-1 text-gray-400 transition-colors duration-200 hover:bg-canvas-bg hover:text-gray-600"
        aria-label="Cerrar"
      >
        <tabler-icon [icon]="iconClose" [size]="18" [stroke]="2" />
      </button>
    </div>

    <ng-content />
  </div>
</div>
