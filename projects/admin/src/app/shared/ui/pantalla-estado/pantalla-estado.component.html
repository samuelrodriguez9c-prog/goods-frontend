@switch (estado()) {
  @case ('cargando') {
    <div class="relative">
      <div class="absolute inset-x-0 top-0 h-0.5 overflow-hidden bg-neutral-200">
        <div
          class="h-full w-[28%] bg-neutral-800 animate-[barra-indeterminada_1.4s_cubic-bezier(.65,0,.35,1)_infinite]"
        ></div>
      </div>

      <div class="flex items-center gap-2.5 px-6 pt-6">
        <app-estado-icono estado="cargando" [px]="18" [grosor]="3.6" />
        <span class="text-[13px] font-medium text-neutral-500" role="status" aria-live="polite">
          Cargando {{ modulo() }}…
        </span>
      </div>

      <ng-content select="[esqueleto]"></ng-content>
    </div>
  }

  @case ('error') {
    <div class="flex h-full items-center justify-center p-6">
      <div
        class="w-[440px] rounded-[14px] border border-neutral-200 bg-white p-[30px_28px_24px] shadow-[0_2px_6px_rgba(0,0,0,0.04)] animate-[aparecer-modal_.3s_cubic-bezier(.2,.7,.3,1)_both]"
        role="alert"
      >
        <div class="flex justify-center">
          <app-estado-icono estado="error" [px]="48" [grosor]="3.4" />
        </div>

        <div
          class="mt-[18px] text-center text-[17px] font-semibold tracking-[-0.01em] text-neutral-900"
        >
          No pudimos cargar {{ modulo() }}
        </div>
        <div class="mt-1.5 text-center text-[13px] leading-5 text-neutral-500 text-pretty">
          {{ mensaje() }}
        </div>

        <div class="mt-5 flex justify-center gap-2.5">
          <button
            type="button"
            (click)="volver.emit()"
            class="rounded-lg border border-neutral-200 px-[15px] py-[9px] text-[13px] font-medium text-neutral-800 hover:border-neutral-400"
          >
            Volver al inicio
          </button>
          <button
            type="button"
            (click)="reintentar.emit()"
            class="rounded-lg bg-primary-button px-[17px] py-[9px] text-[13px] font-medium text-white hover:bg-neutral-900"
          >
            Reintentar
          </button>
        </div>

        @if (detalle() || intento()) {
          <div
            class="mt-5 flex justify-between gap-3 border-t border-neutral-100 pt-3 text-[11px] text-neutral-400"
          >
            <span>{{ detalle() }}</span>
            <span>{{ intento() }}</span>
          </div>
        }
      </div>
    </div>
  }

  @default {
    <ng-content></ng-content>
  }
}
