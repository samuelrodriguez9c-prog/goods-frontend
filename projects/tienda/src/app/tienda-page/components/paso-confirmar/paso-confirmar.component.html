@let t = st.tienda()!;
<div [inert]="pd.paso() !== 4" class="flex h-full w-1/6 flex-col">
  <div class="sin-barra flex flex-1 flex-col items-center overflow-y-auto px-4 pb-12 pt-1 text-center">
    <div class="flex flex-[1_0_auto] flex-col items-center justify-center self-stretch pb-4 pt-3">
      <app-sello [icono]="i.wa" />
      <p class="m-0 mt-2.5 max-w-[13ch] text-balance font-display text-[clamp(36px,7vh,64px)] font-bold leading-[.92] tracking-[-0.025em] [font-variation-settings:'wdth'_78]">¿Ya enviaste el mensaje?</p>
    </div>
    <div class="relative -mx-4 -mb-12 flex-none self-stretch px-4 pb-10 text-bosque">
      <app-ola />
      <div class="relative flex justify-center pt-20"><span class="max-w-[340px] text-pretty rounded-[22px_22px_22px_6px] bg-hoja px-4 py-2.5 text-left text-[12.5px] font-medium leading-[1.4] text-bosque">{{ pd.pedidoGuardado() !== null ? 'Tu pedido #' + pd.pedidoGuardado() + ' ya le llegó a ' + t.nombre + '. Envía el mensaje para seguir la conversación por WhatsApp.' : 'Cuando lo envíes, vaciamos tu pedido aquí para que no lo mandes dos veces.' }}</span></div>
    </div>
  </div>
  <div class="relative z-[2] -mt-px flex shrink-0 items-center gap-2 bg-white p-3 pt-2.5 text-bosque">
    <app-nubes bg="#ffffff" />
    <button type="button" (click)="pd.abrirOtraVez()" class="relative flex h-[52px] items-center gap-[7px] rounded-full bg-transparent pl-2.5 pr-4 text-sm font-medium text-bosque hover:bg-hoja"><tabler-icon [icon]="i.wa" [size]="17" [stroke]="2" class="text-teal" />Abrir otra vez</button>
    <button type="button" (click)="pd.confirmarEnvio()" class="relative ml-auto flex h-[52px] items-center justify-center gap-2 rounded-full bg-bosque px-6 text-[15px] font-semibold text-hoja transition-transform hover:bg-bosque-2 active:scale-[.97]"><tabler-icon [icon]="i.check" [size]="18" [stroke]="2.25" class="text-wa" />Sí, ya lo envié</button>
  </div>
</div>
