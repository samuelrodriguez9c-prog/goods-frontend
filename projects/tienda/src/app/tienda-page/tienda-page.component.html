@switch (st.estado()) {
  @case ('cargando') {
    <main class="p-3" aria-busy="true">
      <div class="flex min-h-[min(880px,calc(100dvh-24px))] flex-col justify-end gap-6 overflow-hidden rounded-[36px] bg-bosque px-[clamp(24px,5vw,72px)] pb-[clamp(36px,5vw,64px)] pt-[140px]">
        <span class="h-4 w-48 animate-pulse rounded-full bg-white/10"></span>
        <span class="h-[clamp(72px,12vw,200px)] w-3/4 animate-pulse rounded-[28px] bg-white/10"></span>
        <span class="h-5 w-96 max-w-full animate-pulse rounded-full bg-white/10"></span>
      </div>
    </main>
  }
  @case ('error') {
    <main class="flex min-h-dvh flex-col items-center justify-center gap-5 px-6 text-center">
      <p class="titular m-0 text-[clamp(44px,8vw,80px)] font-bold text-bosque">Algo falló</p>
      <p class="m-0 max-w-[40ch] text-base leading-relaxed text-texto-2">No pudimos cargar la tienda. Revisa tu conexión y vuelve a intentarlo.</p>
      <button type="button" (click)="st.reintentar()" class="h-[52px] rounded-full bg-bosque px-6 text-[15px] font-semibold text-hoja hover:bg-bosque-2">Reintentar</button>
    </main>
  }
  @case ('no-disponible') {
    <app-no-disponible [motivo]="st.noDisponible().motivo" [slug]="slug()" [nombre]="st.noDisponible().nombre ?? null" [whatsapp]="st.noDisponible().whatsapp ?? null" />
  }
  @case ('lista') {
    <div class="relative min-h-dvh overflow-x-clip">
      <!-- Burbujas de fondo de la página -->
      <div aria-hidden="true" class="pointer-events-none fixed inset-0 z-0 overflow-hidden">
        <div burbuja="0.02,70,0.06" [parallax]="[0.06, -0.18, 0.03]" class="absolute left-[-14vw] top-[30vh] size-[46vw]"><div class="size-full bg-[#e1f1e8] [animation:morph_22s_ease-in-out_infinite]"></div></div>
        <div burbuja="0.035,70,0.06" [parallax]="[-0.05, -0.1, -0.025]" class="absolute right-[-12vw] top-[70vh] size-[38vw]"><div class="size-full bg-[#d6f0e2] [animation:morph_26s_ease-in-out_infinite_reverse]"></div></div>
      </div>

      <app-nav-tienda />

      <main class="relative z-[1]">
        <app-hero-tienda />
        <app-destacado-tienda />
        <app-catalogo-tienda />
        <app-pie-tienda />
      </main>

      <!-- Volver arriba: anillo de progreso de scroll -->
      <button type="button" (click)="st.subir()" aria-label="Volver arriba" title="Volver arriba"
        class="fixed bottom-[23px] right-6 z-[75] grid size-14 place-items-center rounded-full bg-white text-bosque shadow-[0_14px_34px_-14px_rgba(7,42,35,.55)] transition-[opacity,transform] duration-500 ease-[cubic-bezier(.3,1.4,.5,1)] hover:bg-menta"
        [style.opacity]="verSubir() ? 1 : 0" [style.transform]="verSubir() ? 'scale(1)' : 'scale(.6) translateY(20px)'" [style.pointer-events]="verSubir() ? 'auto' : 'none'">
        <svg width="56" height="56" viewBox="0 0 56 56" class="absolute inset-0 -rotate-90" aria-hidden="true">
          <circle cx="28" cy="28" r="25" fill="none" stroke="#e1efe8" stroke-width="2.5" />
          <circle #anillo cx="28" cy="28" r="25" fill="none" stroke="#25d366" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="157.08" stroke-dashoffset="157.08" />
        </svg>
        <tabler-icon [icon]="i.arriba" [size]="21" [stroke]="2" class="relative" />
      </button>

      <app-isla-pedido />
      <app-detalle-producto />
    </div>
  }
}
